<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>Felix e Castro Advocacia Especializada</title>
    <meta name="theme-color" content="#6B1A1F">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="/icon-192.png">
    <link rel="apple-touch-icon" href="/icon-192.png">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link id="manifest-placeholder" rel="manifest" href="/manifest.json">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        h1, h2, h3, .font-display, .font-serif {
            font-family: 'Cormorant Garamond', serif;
            letter-spacing: -0.01em;
        }
        /* Custom Scrollbar - Felix & Castro */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #d9c4a0;
            border-radius: 4px;
        }
        .dark ::-webkit-scrollbar-thumb {
            background: #5a3a1f;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #C9A961;
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 10px;
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
        }
        /* Tiptap Editor Styles */
        .ProseMirror {
            outline: none !important;
            min-height: 29.7cm; /* A4 height approx */
            padding: 2.5cm !important;
        }
        .ProseMirror p {
            margin-bottom: 1em;
        }
        .ProseMirror blockquote {
            border-left: 3px solid #000000;
            padding-left: 1cm;
            margin-left: 0;
            margin-right: 0;
            font-size: 1em;
            line-height: 1.5;
            color: #000000;
        }
        .pdf-export blockquote, .pdf-export blockquote * {
            color: #000000 !important;
            border-left-color: #000000 !important;
        }
        .ProseMirror table {
            border-collapse: collapse;
            table-layout: fixed;
            width: 100%;
            margin: 0;
            overflow: hidden;
        }
        .ProseMirror table td, .ProseMirror table th {
            min-width: 1em;
            border: 1px solid #cbd5e1;
            padding: 3px 5px;
            vertical-align: top;
            box-sizing: border-box;
            position: relative;
            background-color: #ffffff;
        }
        .dark .ProseMirror table td, .dark .ProseMirror table th {
            border-color: #334155;
            background-color: #1e293b;
            color: #f1f5f9;
        }
        .ProseMirror table th {
            font-weight: bold;
            text-align: left;
            background-color: #f1f5f9;
            color: #0f172a;
        }
        .dark .ProseMirror table th {
            background-color: #334155;
            color: #f1f5f9;
        }

        /* Print Styles */
        @media print {
            body {
                background-color: white !important;
                color: black !important;
            }
            .no-print {
                display: none !important;
            }
            .ProseMirror {
                background-color: white !important;
                color: black !important;
                box-shadow: none !important;
                border: none !important;
                padding: 0 !important;
                min-height: auto !important;
            }
            .dark .ProseMirror {
                background-color: white !important;
                color: black !important;
            }
            .dark body {
                background-color: white !important;
                color: black !important;
            }
        }
        .pdf-export {
            font-family: 'Inter', sans-serif;
            font-size: 12pt;
            line-height: 1.5;
            color: black;
            padding: 0;
            width: 190mm;
            box-sizing: border-box;
            background-color: white !important;
            border: none !important;
        }
        .pdf-export p {
            margin-bottom: 1em;
            text-align: justify;
            color: black !important;
        }
        .pdf-export blockquote {
            border-left: 3px solid black !important;
            margin-left: 1cm !important;
            padding-left: 0.5cm !important;
            color: black !important;
            display: block !important;
        }
        .pdf-export blockquote * {
            color: black !important;
        }
    </style>

                <p style="color: rgba(251, 249, 246, 0.6); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.2em; margin-top: 16px; font-family: 'Cormorant Garamond', serif;">Carregando módulos...</p>

            <style>
                @keyframes pulse { 50% { opacity: .7; } }
                @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
            </style>

    </div>
